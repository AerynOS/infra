services:
  caddy:
    image: docker.io/caddy:2
    ports:
      - "5000:80"
    volumes:
      - vessel-state:/vessel
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      infra-test:
  summit:
    image: serpentos/summit:${RUST_PROFILE:-dev}
    environment:
      - RUST_LOG
    volumes:
      - summit-state:/app/state
      - ./summit/.privkey:/app/state/.privkey
      - ./summit/config.toml:/app/config.toml
      - ./summit/seed.toml:/app/seed.toml
    ports:
      - "5001:5001"
    depends_on:
      vessel:
        condition: service_healthy
      avalanche:
        condition: service_started
      caddy:
        condition: service_started
    networks:
      infra-test:
    healthcheck:
      test: nc -z 127.0.0.1 5000 || exit 1
      start_period: 30s
  vessel:
    image: serpentos/vessel:${RUST_PROFILE:-dev}
    environment:
      - RUST_LOG
    volumes:
      - vessel-state:/app/state
      - ./vessel/.privkey:/app/state/.privkey
      - ./vessel/config.toml:/app/config.toml
      - ./import:/import
    ports:
      - "5002:5001"
    depends_on:
      caddy:
        condition: service_started
    healthcheck:
      test: nc -z 127.0.0.1 5001 || exit 1
      start_period: 30s
    networks:
      infra-test:
  avalanche:
    image: serpentos/avalanche:${RUST_PROFILE:-dev}
    # Enable user-ns and map us to root &
    # will automatically apply our subuid / subgid
    # mappings as well
    #
    # Boulder will then run as "root" in the container
    # and wont need to enter a new user-ns and will
    # have sufficient id mappings available to it
    userns_mode: "keep-id:uid=0,gid=0"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    environment:
      - RUST_LOG
    volumes:
      - avalanche-state:/app/state
      - avalanche-boulder-cache:/var/cache/boulder
      - ./avalanche/.privkey:/app/state/.privkey
      - ./avalanche/config.toml:/app/config.toml
    networks:
      infra-test:

volumes:
  summit-state:
  vessel-state:
  avalanche-state:
  avalanche-boulder-cache:

networks:
  infra-test:
